# Render deployment manifest for HouseFinderBD (Rental Home Finder)
# Docs: https://render.com/docs/reference/blueprint-schema

databases:
  - name: housefinderdb
    plan: free
    postgresMajorVersion: "16"
    # Region is free-tier friendly; adjust if you want a specific region.
    region: oregon

services:
  - type: web
    name: housefinderbd
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 3 --threads 8 --timeout 120 --access-logfile -
    envVars:
      - key: DEBUG
        value: "false"
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "housefinderbd.onrender.com,*.onrender.com"
      - key: BEHIND_TLS_PROXY
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SECURE_HSTS_PRELOAD
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: housefinderdb
          property: connectionString
      - key: SECRET_KEY
        # Generate a fresh secret key and set it in the Render dashboard.
        value: "change-me-use-get_random_secret_key-in-production"
      - key: ADMIN_URL_PATH
        value: "admin/"
      - key: GEMINI_API_KEY
        # Optional. Set your Google Gemini key in the dashboard to enable AI features.
        value: ""
      - key: DEFAULT_CITY
        value: "Dhaka"
      - key: CURRENCY_SYMBOL
        value: "৳"