<div id="ai-assistant-root"
     data-endpoint="{% url 'api_ai_chat' %}"
     data-initial-remaining="{{ assistant_remaining }}"
     data-initial-limit="{{ assistant_limit }}"
     data-logged-in="{% if user.is_authenticated %}1{% else %}0{% endif %}">
    <button type="button" id="ai-chat-fab" class="btn btn-classic rounded-circle shadow ai-chat-fab" aria-label="Open AI assistant">
        <i class="bi bi-chat-dots fs-4"></i>
    </button>
    <div id="ai-chat-panel" class="ai-chat-panel d-none border shadow-sm bg-white flex-column">
        <div class="d-flex justify-content-between align-items-center border-bottom px-3 py-2 ai-chat-panel-head">
            <span class="fw-bold small"><i class="bi bi-stars text-success me-1"></i>Rental Assistant</span>
            <button type="button" class="btn-close btn-sm" id="ai-chat-close" aria-label="Close"></button>
        </div>
        <div id="ai-chat-messages" class="ai-chat-messages flex-grow-1 overflow-auto p-3 small"></div>
        <div id="ai-chat-suggestions" class="ai-chat-suggestions px-2 pb-2 d-flex flex-wrap gap-1"></div>
        <div class="border-top p-2 bg-white mt-auto">
            <div class="text-muted ai-chat-limit-note mb-2" id="ai-chat-limit-note"></div>
            <div class="input-group">
                <input type="text" id="ai-chat-input" class="form-control form-control-sm rounded-0"
                       placeholder="Ask about rent, neighborhoods, leases…" maxlength="4000" autocomplete="off">
                <button type="button" class="btn btn-classic btn-sm rounded-0 px-3" id="ai-chat-send">Send</button>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    const root = document.getElementById('ai-assistant-root');
    if (!root) return;

    const endpoint = root.dataset.endpoint;
    let remaining = parseInt(root.dataset.initialRemaining || '0', 10);
    let limit = parseInt(root.dataset.initialLimit || '5', 10);
    const loggedIn = root.dataset.loggedIn === '1';

    const fab = document.getElementById('ai-chat-fab');
    const panel = document.getElementById('ai-chat-panel');
    const closeBtn = document.getElementById('ai-chat-close');
    const messagesEl = document.getElementById('ai-chat-messages');
    const suggestionsEl = document.getElementById('ai-chat-suggestions');
    const input = document.getElementById('ai-chat-input');
    const sendBtn = document.getElementById('ai-chat-send');
    const limitNote = document.getElementById('ai-chat-limit-note');

    let openedOnce = false;

    function getCsrf() {
        const el = document.querySelector('[name=csrfmiddlewaretoken]');
        return el ? el.value : '';
    }

    function updateLimitNote() {
        if (!limitNote) return;
        const scope = loggedIn ? 'today' : 'this session';
        limitNote.textContent = remaining + ' of ' + limit + ' messages left (' + scope + ').';
    }

    function appendBubble(text, role) {
        const wrap = document.createElement('div');
        wrap.className = role === 'user' ? 'ai-msg ai-msg-user' : 'ai-msg ai-msg-bot';
        const inner = document.createElement('div');
        inner.className = 'ai-msg-inner';
        inner.textContent = text;
        wrap.appendChild(inner);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendError(text) {
        const wrap = document.createElement('div');
        wrap.className = 'ai-msg ai-msg-error';
        const inner = document.createElement('div');
        inner.className = 'ai-msg-inner';
        inner.textContent = text;
        wrap.appendChild(inner);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderSuggestions(items) {
        suggestionsEl.innerHTML = '';
        (items || []).slice(0, 3).forEach(function (q) {
            if (!q) return;
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'btn btn-outline-secondary btn-sm rounded-0 text-start';
            b.style.maxWidth = '100%';
            b.style.fontSize = '0.72rem';
            b.textContent = q;
            b.addEventListener('click', function () {
                input.value = q;
                input.focus();
            });
            suggestionsEl.appendChild(b);
        });
    }

    function openPanel() {
        panel.classList.remove('d-none');
        panel.classList.add('d-flex');
        if (!openedOnce) {
            openedOnce = true;
            appendBubble(
                'Hi - I help with renting in Bangladesh, leases, budgeting, and using Rental Finder. What would you like to know?',
                'bot'
            );
            updateLimitNote();
        }
        input.focus();
    }

    function closePanel() {
        panel.classList.add('d-none');
        panel.classList.remove('d-flex');
    }

    fab.addEventListener('click', function () {
        if (panel.classList.contains('d-none')) openPanel();
        else closePanel();
    });
    closeBtn.addEventListener('click', closePanel);

    async function sendMessage() {
        const text = (input.value || '').trim();
        if (!text) return;
        if (remaining <= 0) {
            appendError(loggedIn
                ? 'You have used all messages for today. Please try again tomorrow.'
                : 'Guest message limit reached. Log in for more messages per day.');
            return;
        }

        appendBubble(text, 'user');
        input.value = '';
        suggestionsEl.innerHTML = '';
        sendBtn.disabled = true;

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrf(),
                },
                body: JSON.stringify({ message: text }),
            });
            const data = await res.json().catch(function () { return {}; });

            if (!res.ok) {
                appendError(data.error || 'Something went wrong.');
                if (typeof data.remaining === 'number') remaining = data.remaining;
                updateLimitNote();
                return;
            }

            appendBubble(data.reply || '', 'bot');
            remaining = typeof data.remaining === 'number' ? data.remaining : remaining;
            limit = typeof data.limit === 'number' ? data.limit : limit;
            renderSuggestions(data.suggested);
            updateLimitNote();
        } catch (e) {
            appendError('Network error. Please try again.');
        } finally {
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    });

    updateLimitNote();
})();
</script>
