{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %} - Add Room{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h2 class="h4 mb-4 fw-bold">Add Room to {{ hotel.name }}</h2>
        <div class="bg-white border p-4 shadow-sm">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-classic flex-grow-1 py-3">Add Room</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary rounded-0 py-3 px-4">Done</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
