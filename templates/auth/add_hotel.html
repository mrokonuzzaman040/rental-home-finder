{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %} - Add Hotel{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h2 class="h4 mb-4 fw-bold">Add Hotel</h2>
        <div class="bg-white border p-4 shadow-sm">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-classic w-100 py-3">Save &amp; Add Rooms</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
